services:
  - type: web
    name: temir_dokonn
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn temir_dokonn.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2